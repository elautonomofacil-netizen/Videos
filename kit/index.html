<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kit del autónomo 2027 · El Autónomo Fácil</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#18203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Autónomo">
<meta name="robots" content="noindex">
<style>
:root{--bg:#fff8e6;--ink:#18203a;--muted:#5b6380;--card:#fff;--yel:#ffd23f;--pink:#ff3d8b;--green:#1f9d6b;--red:#d63a2f;--line:#e8e2d0;--blue:#3b6cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.top .back{font-size:22px;font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
header.top h1{font-size:24px;line-height:1.1}
.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
h1.big{font-size:32px;line-height:1.08;margin:6px 0 4px;letter-spacing:-.5px}
h1.big span,.hl{background:var(--yel);padding:0 6px;border-radius:6px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.lead{color:var(--muted)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px 12px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;font:inherit;color:inherit}
.tile .ic{font-size:34px}
.tile b{font-size:17px}
.tile small{color:var(--muted);font-size:12px}
.tile.y{background:var(--yel)}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:15px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input,select,textarea{width:100%;font-size:17px;padding:11px;border:2px solid var(--line);border-radius:12px;background:#fffdf6;color:var(--ink);font-family:inherit}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;font-size:15px;font-weight:700;padding:10px 6px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;font-size:16px;padding:13px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--yel);color:var(--ink);cursor:pointer;text-decoration:none;width:100%;margin-top:12px}
.btn.pink{background:var(--pink);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin-top:0;border-width:2px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed var(--line);font-size:15px}
.line b{white-space:nowrap}
.line.neg b{color:var(--red)}
.bigres{margin-top:12px;background:var(--yel);border-radius:14px;padding:14px;text-align:center}
.bigres small{display:block;font-weight:700;font-size:13px}
.bigres strong{display:block;font-size:34px;letter-spacing:-1px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font:inherit;font-weight:800;font-size:14px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
table.q{width:100%;border-collapse:collapse;font-size:14px}
table.q th,table.q td{border-bottom:2px dashed var(--line);padding:7px 4px;text-align:right}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q input{font-size:15px;padding:7px;text-align:right}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed var(--line)}
.ev .d{min-width:62px;text-align:center;background:var(--ink);color:#fff;border-radius:12px;padding:6px 4px;font-weight:900;line-height:1.05}
.ev .d small{display:block;font-size:11px;font-weight:700;color:var(--yel);text-transform:uppercase}
.ev .d span{font-size:24px}
.ev .t{flex:1}
.ev .t b{display:block}
.ev .t a{font-size:13px;color:var(--blue);font-weight:700}
details.g{background:#fff;border:3px solid var(--ink);border-radius:16px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
details.g summary{font-weight:900;font-size:17px;padding:14px;cursor:pointer;list-style:none}
details.g summary::-webkit-details-marker{display:none}
details.g[open] summary{border-bottom:2px dashed var(--line)}
details.g .in{padding:6px 14px 14px;font-size:15px}
details.g ul{padding-left:20px;margin:6px 0}
details.g li{margin:4px 0}
.it{display:grid;grid-template-columns:1fr 60px 90px 34px;gap:6px;margin-top:8px;align-items:center}
.it input{font-size:15px;padding:9px}
.x{background:#fff;border:2px solid var(--line);border-radius:10px;height:40px;font-size:18px;cursor:pointer}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line);font-size:14px;gap:8px}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.err{color:var(--red);font-weight:700;margin-top:8px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
/* Documento imprimible */
#doc{display:none}
.docbox{background:#fff;color:#111;font-family:Helvetica,Arial,sans-serif;font-size:13px;padding:28px;border:1px solid #ddd;border-radius:8px}
.docbox h1{font-size:26px;margin:0 0 4px}
.docbox .meta{display:flex;justify-content:space-between;gap:20px;margin:18px 0}
.docbox .meta div{flex:1}
.docbox table{width:100%;border-collapse:collapse;margin-top:12px}
.docbox th{background:#18203a;color:#fff;text-align:left;padding:8px;font-size:12px}
.docbox td{border-bottom:1px solid #ddd;padding:8px}
.docbox .r{text-align:right}
.docbox .tot{margin-left:auto;width:60%;margin-top:12px}
.docbox .tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee}
.docbox .tot .g{font-weight:800;font-size:16px;border-bottom:2px solid #111}
.docbox .foot{margin-top:24px;font-size:11px;color:#555}
@media print{
  body{background:#fff}
  #app,.toast{display:none!important}
  #doc{display:block!important}
  .docbox{border:none;padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="doc"></div>
<div class="toast" id="toast"></div>
<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'})+' €';
const num=v=>{const x=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isFinite(x)?x:0};
const numIn=v=>{const s=String(v??'').trim();if(/,/.test(s))return num(s);const x=parseFloat(s);return isFinite(x)?x:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('kitAF_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kitAF_'+k,JSON.stringify(v))}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function fdate(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function head(title){return `<header class="top"><div class="back" onclick="go('')">←</div><h1>${title}</h1></header>`}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado ✅')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copiado ✅')}}
function go(r){location.hash=r?'#'+r:'#'}

/* ============ acceso ============ */
const CODE_HASH='f0ef1713ca4dd433fe69260314b9a3629ca60b514c23ba96d1be90d51f932e3e';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryCode(){
  const v=$('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(await sha(v)===CODE_HASH){LS.set('ok',true);route()}else{$('#cerr').textContent='Ese código no es correcto. Lo tienes en tu email de compra de Gumroad.'}
}
function lockView(){
  app.innerHTML=`<div class="lock">
  <div class="brand">El Autónomo Fácil</div>
  <h1 class="big">Kit del autónomo <span>2027</span> 🧰</h1>
  <p class="lead">Escribe el código de acceso que te llegó al comprar el kit. Solo lo tendrás que poner una vez.</p>
  <div class="card"><label for="code">Código de acceso</label><input id="code" autocomplete="off" autocapitalize="characters" placeholder="Ej.: XXXX-XXXX-XXXX">
  <button class="btn dark" onclick="tryCode()">Entrar</button><div class="err" id="cerr"></div></div>
  <p class="note">¿No tienes el kit? <a href="https://elautonomofacil.gumroad.com/l/kit-autonomo">Consíguelo aquí</a>. ¿Lo compraste y no encuentras el código? Búscalo en tu email ("Gumroad") o escríbenos respondiendo a ese email.</p></div>`;
  $('#code').addEventListener('keydown',e=>{if(e.key==='Enter')tryCode()});
}

/* ============ inicio ============ */
function homeView(){
  const me=LS.get('me',{});
  app.innerHTML=`<div class="brand">El Autónomo Fácil</div>
  <h1 class="big">Kit del autónomo <span>2027</span></h1>
  <p class="lead">${me.nombre?'Hola, '+esc(me.nombre.split(' ')[0])+' 👋 ':''}¿Qué necesitas hoy?</p>
  <div class="grid" style="margin-top:14px">
    <button class="tile y" onclick="go('calc')"><span class="ic">🧮</span><span><b>Calculadora</b><br><small>Mes, trimestre, renta y cuota</small></span></button>
    <button class="tile" onclick="go('facturas')"><span class="ic">🧾</span><span><b>Facturas</b><br><small>Con los 7 datos, en PDF</small></span></button>
    <button class="tile" onclick="go('presupuestos')"><span class="ic">📝</span><span><b>Presupuestos</b><br><small>Con señal para empezar</small></span></button>
    <button class="tile" onclick="go('emails')"><span class="ic">✉️</span><span><b>Cobrar</b><br><small>Mensajes para clientes que no pagan</small></span></button>
    <button class="tile" onclick="go('calendario')"><span class="ic">📅</span><span><b>Calendario</b><br><small>Plazos 2027 con avisos</small></span></button>
    <button class="tile" onclick="go('guia')"><span class="ic">📘</span><span><b>Guía fácil</b><br><small>Todo sin palabras raras</small></span></button>
  </div>
  <button class="btn ghost" onclick="go('datos')">👤 Mis datos (para facturas)</button>
  <div class="card" style="margin-top:18px;background:#fff3c4">
    <b>📱 ¿Aún no la tienes como app?</b>
    <p class="note" style="color:var(--ink)"><b>iPhone:</b> Safari → Compartir → «Añadir a pantalla de inicio».<br><b>Android:</b> Chrome → ⋮ → «Añadir a pantalla de inicio».</p>
  </div>
  <p class="note">Tus datos se guardan solo en este móvil. Si borras los datos del navegador o cambias de móvil, se pierden. Es orientativo: no sustituye a un gestor.</p>`;
}

/* ============ mis datos ============ */
function datosView(){
  const me=LS.get('me',{});
  app.innerHTML=head('👤 Mis datos')+`<p class="lead">Se usan para rellenar tus facturas y presupuestos. Solo se guardan en tu móvil.</p>
  <div class="card">
  <label>Nombre y apellidos (o empresa)</label><input id="m_nombre" value="${esc(me.nombre)}">
  <label>NIF</label><input id="m_nif" value="${esc(me.nif)}" autocapitalize="characters">
  <label>Dirección completa</label><input id="m_dir" value="${esc(me.dir)}">
  <div class="row"><div><label>Email</label><input id="m_email" type="email" value="${esc(me.email)}"></div><div><label>Teléfono</label><input id="m_tel" value="${esc(me.tel)}"></div></div>
  <label>IBAN <span class="hint">(opcional, sale en la factura para que te paguen)</span></label><input id="m_iban" value="${esc(me.iban)}" autocapitalize="characters">
  <label>Serie de tus facturas <span class="hint">(se reinicia cada año)</span></label><input id="m_serie" value="${esc(me.serie||new Date().getFullYear())}">
  <button class="btn dark" onclick="saveMe()">Guardar</button></div>`;
}
function saveMe(){const f=k=>$('#m_'+k).value.trim();LS.set('me',{nombre:f('nombre'),nif:f('nif'),dir:f('dir'),email:f('email'),tel:f('tel'),iban:f('iban'),serie:f('serie')});toast('Guardado ✅');go('')}

/* ============ calculadora ============ */
const ESC=[[12450,.19],[20200,.24],[35200,.30],[60000,.37],[300000,.45],[Infinity,.47]];
function escala(b){let t=0,p=0;for(const [l,r] of ESC){if(b<=p)break;t+=(Math.min(b,l)-p)*r;p=l}return t}
function minDesc(n){const v=[2400,2700,4000,4500];let s=0;for(let i=0;i<n;i++)s+=v[Math.min(i,3)];return s}
function irpfAnual(R,hijos,mitad){const dj=Math.min(2000,Math.max(0,R)*0.05);const base=Math.max(0,R-dj);const mn=5550+minDesc(hijos)*mitad;return Math.max(0,escala(base)-escala(Math.min(mn,base)))}
// Cuota 2026 (31,5 % de la base mínima de cada tramo)
const TRAMOS=[[670,205.88,'Reducida 1'],[900,226.47,'Reducida 2'],[1166.69,267.65,'Reducida 3'],[1300,299.56,'General 1'],[1500,302.65,'General 2'],[1700,302.65,'General 3'],[1850,360.29,'General 4'],[2030,380.88,'General 5'],[2330,401.47,'General 6'],[2760,427.21,'General 7'],[3190,452.94,'General 8'],[3620,478.68,'General 9'],[4050,504.41,'General 10'],[6000,545.59,'General 11'],[Infinity,607.35,'General 12']];
let calcTab='mes';
function calcView(){
  app.innerHTML=head('🧮 Calculadora')+`<div class="tabs">
  ${[['mes','Mi mes'],['tri','Trimestre'],['cuota','Mi cuota'],['renta','Renta']].map(([k,t])=>`<button class="${calcTab===k?'on':''}" onclick="calcTab='${k}';calcView()">${t}</button>`).join('')}</div><div id="cv"></div>`;
  ({mes:calcMes,tri:calcTri,cuota:calcCuota,renta:calcRenta})[calcTab]();
}
function segHTML(id,opts,val){return `<div class="seg" id="${id}">${opts.map(([v,t])=>`<button data-v="${v}" class="${String(v)===String(val)?'on':''}">${t}</button>`).join('')}</div>`}
function bindSeg(id,cb){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v)})}
function calcMes(){
  const s=LS.get('cmes',{B:1500,G:100,C:300,iva:0.21,ret:0,hijos:0,mitad:0.5,minor:0});
  $('#cv').innerHTML=`<div class="card">
  <label>Lo que facturas al mes, <u>sin IVA</u> (€)</label><input id="B" inputmode="decimal" value="${s.B}">
  <label>IVA que cobras</label>${segHTML('iva',[[0.21,'21 %'],[0.10,'10 %'],[0.04,'4 %'],[0,'Sin IVA']],s.iva)}
  <label>¿Te retienen IRPF?</label>${segHTML('ret',[[0,'No'],[0.07,'Sí, 7 %'],[0.15,'Sí, 15 %']],s.ret)}
  <div class="row"><div><label>Gastos del mes <span class="hint">(con IVA)</span></label><input id="G" inputmode="decimal" value="${s.G}"></div><div><label>Cuota autónomo</label><input id="C" inputmode="decimal" value="${s.C}"></div></div>
  <label>Hijos a tu cargo</label>${segHTML('hijos',[[0,'0'],[1,'1'],[2,'2'],[3,'3'],[4,'4+']],s.hijos)}
  <label>¿Los hijos los declaráis los dos?</label>${segHTML('mitad',[[0.5,'Sí, a medias'],[1,'No, solo yo']],s.mitad)}
  <label>Lo que ganaste neto el año pasado</label><select id="minor">${[[0,'Más de 12.000 €'],[25,'11.000–12.000 €'],[50,'10.000–11.000 €'],[75,'9.000–10.000 €'],[100,'9.000 € o menos']].map(([v,t])=>`<option value="${v}" ${+s.minor===v?'selected':''}>${t}</option>`).join('')}</select>
  </div><div class="card" id="mr"></div>`;
  const run=()=>{
    s.B=numIn($('#B').value);s.G=numIn($('#G').value);s.C=numIn($('#C').value);s.minor=+$('#minor').value;LS.set('cmes',s);
    const gB=s.G/1.21,gI=s.G-gB,entra=s.B*(1+ +s.iva- +s.ret),ivaP=Math.max(0,s.B*s.iva-gI),rend=s.B-gB-s.C;
    const adel=+s.ret>0?0:Math.max(0,.2*rend-s.minor/3);
    const real=irpfAnual(rend*12,+s.hijos,+s.mitad);const tuyo=s.B-gB-s.C-real/12;
    const adelA=+s.ret>0?s.B*s.ret*12:adel*12,dif=real-adelA;
    $('#mr').innerHTML=`<h2 style="margin-top:0">Tu mes</h2>
    <div class="line"><span>Te entra en la cuenta</span><b>${eur(entra)}</b></div>
    <div class="line neg"><span>IVA para Hacienda</span><b>− ${eur(ivaP)}</b></div>
    <div class="line neg"><span>Adelanto IRPF (modelo 130)</span><b>${+s.ret>0?'0 € (te lo retienen)':'− '+eur(adel)}</b></div>
    <div class="line neg"><span>Cuota de autónomo</span><b>− ${eur(s.C)}</b></div>
    <div class="line neg"><span>Gastos</span><b>− ${eur(s.G)}</b></div>
    <div class="bigres"><small>Lo que es TUYO de verdad</small><strong>${eur(tuyo)}</strong><small>ya contando lo que te toque en la renta</small></div>
    <div class="line" style="margin-top:10px"><span>En la renta del año (aprox.)</span><b>${Math.abs(dif)<50?'En paz 👌':dif<0?'Te devuelven '+eur(-dif):'Pagas '+eur(dif)}</b></div>
    <p class="note">Orientativo: escala general del IRPF, mínimo personal y familiar y 5 % de gastos de difícil justificación (máx. 2.000 €). Tu comunidad puede cambiarlo un poco.</p>`;
  };
  ['B','G','C'].forEach(i=>$('#'+i).addEventListener('input',run));$('#minor').onchange=run;
  bindSeg('iva',v=>{s.iva=+v;run()});bindSeg('ret',v=>{s.ret=+v;run()});bindSeg('hijos',v=>{s.hijos=+v;run()});bindSeg('mitad',v=>{s.mitad=+v;run()});
  run();
}
let triQ=0;
function calcTri(){
  const d=LS.get('ctri',{q:[{},{},{},{}],minor:0});
  const rows=[['ing','Ingresos sin IVA (€)'],['ivar','IVA que has cobrado (€)'],['gas','Gastos sin IVA (€)'],['ivas','IVA de tus gastos (€)'],['cuo','Cuota de autónomo de los 3 meses (€)'],['ret','Retenciones que te hicieron (€)']];
  $('#cv').innerHTML=`<div class="card"><p class="lead" style="margin-top:0">Elige el trimestre y pon lo que has facturado y gastado. Te dice qué pagar en el <b>303 (IVA)</b> y en el <b>130 (IRPF)</b>.</p>
  ${segHTML('tq',[[0,'1T'],[1,'2T'],[2,'3T'],[3,'4T']],triQ)}
  ${rows.map(([k,t])=>`<label>${t}</label><input data-k="${k}" class="tqi" inputmode="decimal" value="${d.q[triQ][k]??''}">`).join('')}
  <button class="btn ghost sm" style="margin-top:12px" onclick="autoIVA()">Poner el IVA al 21 % automáticamente</button>
  <label>Lo que ganaste neto el año pasado</label><select id="tminor">${[[0,'Más de 12.000 €'],[25,'11.000–12.000 €'],[50,'10.000–11.000 €'],[75,'9.000–10.000 €'],[100,'9.000 € o menos']].map(([v,t])=>`<option value="${v}" ${+d.minor===v?'selected':''}>${t}</option>`).join('')}</select>
  </div><div class="card" id="tr"></div>`;
  const run=()=>{
    document.querySelectorAll('.tqi').forEach(e=>{d.q[triQ][e.dataset.k]=e.value});d.minor=+$('#tminor').value;LS.set('ctri',d);
    let acR=0,acRet=0,acPag=0,out='';
    for(let i=0;i<4;i++){const q=d.q[i];const v=k=>numIn(q[k]);
      const iva=v('ivar')-v('ivas');acR+=v('ing')-v('gas')-v('cuo');acRet+=v('ret');
      const p130=Math.max(0,.2*Math.max(0,acR)-acRet-acPag-d.minor);acPag+=p130;
      const empty=!q.ing&&!q.gas;
      out+=`<tr style="${i===triQ?'background:#fff3c4':''}"><td><b>${i+1}T</b></td><td>${empty?'–':(iva<0?'<span style="color:var(--green)">'+eur(-iva)+' a compensar</span>':eur(iva))}</td><td>${empty?'–':eur(p130)}</td></tr>`}
    $('#tr').innerHTML=`<h2 style="margin-top:0">Lo que te toca pagar</h2><table class="q"><tr><th>Trimestre</th><th>303 · IVA</th><th>130 · IRPF</th></tr>${out}</table>

  };
  document.querySelectorAll('.tqi').forEach(e=>e.addEventListener('input',run));$('#tminor').onchange=run;
  bindSeg('tq',v=>{run();triQ=+v;calcTri()});
  window.autoIVA=()=>{const q=d.q[triQ];const ing=numIn(q.ing),g=numIn(q.gas);if(ing)document.querySelector('.tqi[data-k="ivar"]').value=(ing*0.21).toFixed(2);if(g)document.querySelector('.tqi[data-k="ivas"]').value=(g*0.21).toFixed(2);run()};
  run();
}

/* ============ router ============ */
function route(){
  if(!LS.get('ok',false)){lockView();return}
  const r=location.hash.replace('#','');window.scrollTo(0,0);
  ({'':homeView,calc:calcView,facturas:()=>docForm('factura'),presupuestos:()=>docForm('presupuesto'),emails:emailsView,calendario:calView,guia:guiaView,datos:datosView}[r]||homeView)();
